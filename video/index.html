(()=>{
const TL = [{"id":"c01a","cap":0,"texto":"2, 3, 5, 7, 11, 13. Son los números primos: los que solo se pueden dividir entre uno y entre sí mismos.","start":3.1,"dur":7.102},{"id":"c01b","cap":0,"texto":"Parecen sueltos, sin ningún patrón. Y no son un juego de matemáticos. Con ellos se protegen las compras por internet, los mensajes del móvil y las claves del banco.","start":10.752,"dur":8.85},{"id":"c01c","cap":0,"texto":"En 1859, un matemático alemán, Bernhard Riemann, escribió una frase que sigue sin demostrar. Si es cierta, los primos tienen un orden escondido. Te la voy a explicar paso a paso.","start":20.152,"dur":11.471},{"id":"c02a","cap":1,"texto":"Riemann no intentó adivinar cada primo. Hizo una pregunta más sencilla: hasta un número cualquiera, ¿cuántos primos hay?","start":35.273,"dur":6.552},{"id":"c02b","cap":1,"texto":"Vamos contando. Hasta el 10 hay 4: el 2, el 3, el 5 y el 7. Hasta el 40, 12. Hasta el 100, 25.","start":42.375,"dur":8.251},{"id":"c02c","cap":1,"texto":"Si lo dibujas, sale una escalera. Cada primo es un escalón de la misma altura. Pero mira el ancho: unos escalones son cortos y otros muy largos. Los primos llegan cuando quieren.","start":51.176,"dur":10.342},{"id":"c02d","cap":1,"texto":"Y otra cosa. La escalera se va tumbando. Cuanto más avanzas, más escasos son los primos.","start":62.068,"dur":5.503},{"id":"c02e","cap":1,"texto":"Ya tenemos lo que queremos medir: la escalera. Ahora nos falta algo con qué compararla. Y aquí aparece Gauss.","start":68.121,"dur":6.291},{"id":"c03a","cap":2,"texto":"Con 15 años, Carl Friedrich Gauss se dio cuenta de algo. Cerca de un número x, más o menos 1 de cada «logaritmo de x» números es primo. Cerca del 100, eso da unos 2 primos por cada decena.","start":78.062,"dur":11.194},{"id":"c03b","cap":2,"texto":"Si vas sumando esa probabilidad número a número, sale una curva lisa. Los matemáticos la llaman Li de x, y es la predicción de Gauss.","start":89.806,"dur":7.584},{"id":"c03c","cap":2,"texto":"¿Funciona? Muy bien. Hasta un millón hay 78.498 primos. La curva de Gauss dice 78.627. Se equivoca en unos 130, un 0,16 %. Es poquísimo. Pero siempre se equivoca algo.","start":97.94,"dur":16.208},{"id":"c03d","cap":2,"texto":"Y la gran pregunta es esta: ¿cuánto se puede llegar a equivocar, como mucho? Ahí es donde entra Riemann.","start":114.698,"dur":5.542},{"id":"c03e","cap":2,"texto":"Para responderla, Riemann necesitaba una herramienta que llevara dentro a todos los primos a la vez. Esa herramienta es la función zeta.","start":120.791,"dur":7.081},{"id":"c04a","cap":3,"texto":"Riemann usó una función que ya conocía Euler. Se llama zeta, y es una suma infinita: 1, más 1/2 elevado a s, más 1/3 elevado a s, y así para siempre.","start":131.521,"dur":9.527},{"id":"c04b","cap":3,"texto":"Si s vale 2, la suma da 1,6449, que es exactamente pi al cuadrado entre 6. Euler lo descubrió en 1734.","start":141.598,"dur":8.717},{"id":"c04c","cap":3,"texto":"Pero lo mejor es otra cosa. Euler vio que esa misma suma se puede escribir como un producto, con un factor por cada número primo. La zeta está hecha de primos.","start":150.866,"dur":8.45},{"id":"c04d","cap":3,"texto":"¿Por qué funciona? Porque cada número se escribe de una sola manera como producto de primos. El 12 es 2 por 2 por 3, y nada más. Al multiplicar los factores de todos los primos aparecen, uno por uno, todos los números, cada uno una sola vez. Por eso la suma y el producto son la misma cosa.","start":159.865,"dur":16.361},{"id":"c04x","cap":3,"texto":"Se puede ver como una criba. Si multiplicas la suma por 1 menos 1/2 elevado a s, desaparecen todos los términos pares: el 2, el 4, el 6. Si luego lo haces con el 3, se van sus múltiplos. Y cuando has pasado por todos los primos, solo queda el 1.","start":176.776,"dur":15.094},{"id":"c04e","cap":3,"texto":"Y eso es la clave de todo: cualquier cosa que descubras de la zeta es, en el fondo, información sobre los primos.","start":192.42,"dur":5.652},{"id":"c04f","cap":3,"texto":"Eso sí, tiene un problema. Si s vale 1, la suma crece sin parar, y por debajo de 1 ni siquiera tiene sentido. Es un muro. Y la información que buscamos está justo detrás.","start":198.622,"dur":10.258},{"id":"c05a","cap":4,"texto":"Para saltar el muro, Riemann hizo algo genial. Dejó que s fuera un número complejo, con dos partes: una parte real, sigma, y una parte imaginaria, t.","start":212.529,"dur":8.784},{"id":"c05b","cap":4,"texto":"¿Qué cambia? Que cada término de la suma se convierte en una flecha. Sigma decide cuánto mide la flecha. T decide hacia dónde apunta.","start":221.863,"dur":7.613},{"id":"c05c","cap":4,"texto":"Sumar la serie es encadenar flechas. Con t igual a 0, todas apuntan al mismo lado. Pero en cuanto t no es cero, cada flecha gira un poco más que la anterior, y la cadena se enrosca sobre sí misma.","start":230.026,"dur":10.711},{"id":"c05d","cap":4,"texto":"Un ejemplo con números. Tomamos sigma 0,5 y t 14,13. En x igual a 100, el tamaño es la raíz de 100, o sea 10, y el giro deja la parte real en menos 6,4. En x igual a 400, el tamaño es 20, y la parte real, menos 19,8.","start":241.287,"dur":16.456},{"id":"c05e","cap":4,"texto":"¿Y por qué hacen falta giros? Porque los primos llegan a saltos, y para dibujar saltos con curvas lisas hacen falta oscilaciones. Las oscilaciones las pone t. Y lo grandes que son, las pone sigma.","start":258.293,"dur":11.341},{"id":"c05f","cap":4,"texto":"Tú quédate con la idea: sigma controla el tamaño, t controla el giro. Lo vamos a necesitar enseguida.","start":270.184,"dur":5.654},{"id":"c06a","cap":5,"texto":"Ahora hay que cruzar el muro. El truco es fácil de contar. Si alternas los signos, 1 menos 1/2 más 1/3 menos 1/4, las flechas se van compensando y la suma vuelve a tener sentido más allá del muro. De esa serie alterna se despeja la zeta. Así, Riemann la pudo calcular en toda una franja entre 0 y 1.","start":279.488,"dur":18.17},{"id":"c06b","cap":5,"texto":"Y ahí dentro la zeta se hace cero en puntos muy concretos. El primero está a la altura 14,13. El segundo, a 21,02. El tercero, a 25,01. Son los famosos ceros de Riemann.","start":298.209,"dur":13.035},{"id":"c06x","cap":5,"texto":"Ojo, no hay que confundirlos con otros. La zeta también vale cero en menos 2, menos 4, menos 6, y así siempre. Son los ceros triviales: están sobre el eje real, fuera de la franja, y no esconden nada sobre los primos.","start":311.793,"dur":12.914},{"id":"c06y","cap":5,"texto":"Los ceros de Riemann son los otros, los no triviales, y ninguno está en el eje. En la altura 0, la línea del medio vale menos 1,46, no cero. Además van por parejas: si hay uno a la altura 14,13, hay otro a menos 14,13.","start":325.257,"dur":14.502},{"id":"c06z","cap":5,"texto":"Mira ahora qué pasa si subimos por la línea del medio. A la izquierda, un punto sube por la línea. A la derecha, dibujamos el valor de la zeta en ese punto. La curva da vueltas, y justo cuando el punto llega a 14,13, pasa por el centro: la zeta vale cero. Vuelve a pasar en 21,02, y en 25,01. Cada paso por el centro es un cero.","start":340.309,"dur":20.828},{"id":"c06w","cap":5,"texto":"Y fíjate en una cosa. Es la cadena de flechas del capítulo 5, con los signos alternos. En un cero, la cadena termina justo en el centro.","start":361.687,"dur":7.999},{"id":"c06c","cap":5,"texto":"Ahora fíjate dónde caen. Todos, exactamente, en la línea del medio, donde sigma vale 0,5. Se han calculado unos 10 billones de ceros, y ni uno solo se sale de la línea.","start":370.236,"dur":10.088},{"id":"c06d","cap":5,"texto":"¿Y por qué nos importan tanto los ceros? Porque la fórmula que une la zeta con los primos se construye justo con ellos. Es lo que vamos a ver ahora.","start":380.874,"dur":7.879},{"id":"c07a","cap":6,"texto":"¿Y qué tienen que ver los ceros con los primos? Aquí está la magia. Riemann encontró una fórmula exacta. Dice que la escalera de los primos es igual a la curva lisa de Gauss más una onda por cada cero.","start":392.404,"dur":11.011},{"id":"c07b","cap":6,"texto":"Y cada onda es la potencia del capítulo 5: x elevado al cero. Su tamaño es x elevado a sigma. Su giro, t por el logaritmo de x. Es la misma cuenta que hicimos con el 100 y el 400.","start":403.965,"dur":12.238},{"id":"c07c","cap":6,"texto":"Cada onda tiene dos datos. La altura del cero, t, decide dónde oscila: dónde caen los escalones. Y la parte real, sigma, decide cuánto: cuánto se aparta la escalera de la curva lisa.","start":416.752,"dur":10.654},{"id":"c07d","cap":6,"texto":"Mira lo que pasa al sumarlas. Con 1 onda, la curva apenas se mueve. Con 10, ya se insinúan los escalones. Con 50, la curva lisa se ha convertido casi en la escalera exacta de los primos.","start":427.957,"dur":11.337},{"id":"c07x","cap":6,"texto":"Visto de otra forma: si sumas solo las oscilaciones de los ceros, salen picos justo en los primos. En el 2, el 3, el 5, el 7, el 11. Y también en sus potencias, como el 4, el 8 o el 9.","start":439.843,"dur":11.793},{"id":"c07e","cap":6,"texto":"Los primos, que parecían sueltos, son la suma de las ondas de los ceros.","start":452.187,"dur":3.784},{"id":"c08a","cap":7,"texto":"Y ahora sí, la hipótesis de Riemann. Dice que todos los ceros están en la línea del medio, todos con sigma 0,5.","start":459.62,"dur":7},{"id":"c08b","cap":7,"texto":"¿Por qué importa tanto? Porque sigma es el volumen de cada onda. Y cuando sumas muchas ondas, a la larga manda la que tiene más volumen, la del sigma más grande. Por eso el error de Gauss crece como x elevado a ese sigma.","start":467.171,"dur":12.194},{"id":"c08c","cap":7,"texto":"Si todos valen 0,5, ninguna onda se dispara, y el error queda siempre por debajo de raíz de x por logaritmo de x. Es el error más pequeño posible. Lo demostró von Koch en 1901: decir que todos los ceros están en la línea y decir que el error de Gauss es mínimo es exactamente lo mismo.","start":479.915,"dur":16.605},{"id":"c08d","cap":7,"texto":"Pero ojo. Si hubiera un solo cero con sigma 0,8, su onda crecería mucho más deprisa. En 1 millón, en vez de un error de unos 1.000, tendríamos uno de 63.000. El orden de los primos se vendría abajo.","start":497.07,"dur":12.332},{"id":"c08e","cap":7,"texto":"Y no vendría solo. Por una simetría que demostró el propio Riemann, cada cero fuera de la línea trae un gemelo reflejado al otro lado.","start":509.952,"dur":7.128},{"id":"c09a","cap":8,"texto":"¿Qué se sabe? En 1896, Hadamard y de la Vallée Poussin demostraron que todos los ceros están dentro de la franja, y con eso, que la curva de Gauss acierta a la larga. Después se demostró que más del 40 % de los ceros están en la línea.","start":520.729,"dur":13.74},{"id":"c09b","cap":8,"texto":"En octubre de 2026, una inteligencia artificial de OpenAI presentó una prueba de que todos los ceros están entre 1/8 y 7/8. Los expertos todavía la están revisando.","start":535.02,"dur":10.181},{"id":"c09c","cap":8,"texto":"Pero la línea exacta, la del medio, sigue sin demostrar. El Instituto Clay ofrece un millón de dólares a quien lo consiga.","start":545.751,"dur":6.577},{"id":"c09x","cap":8,"texto":"Y una aclaración importante. Demostrar la hipótesis no es encontrar todos los ceros, porque son infinitos. Es demostrar que ninguno, por alto que esté, se sale de la línea.","start":552.878,"dur":9.388},{"id":"c10a","cap":9,"texto":"Repasemos. Los primos construyen la zeta. La zeta, llevada al plano complejo, tiene ceros. Cada cero produce una onda. Y las ondas, sumadas, dibujan la escalera de los primos.","start":565.916,"dur":11.163},{"id":"c10b","cap":9,"texto":"La hipótesis de Riemann dice que todas esas ondas tienen el volumen más bajo posible. Desde 1859, nadie ha podido demostrarlo. Tienes la explicación completa, con todos los gráficos para tocar, en el enlace.","start":577.629,"dur":12.504}];
